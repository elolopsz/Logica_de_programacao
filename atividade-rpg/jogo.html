<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Império das Sombras</title>
</head>

<body>

    <div class="container mt-4">

        <div class="card shadow">

            <!-- Header -->
            <div class="card-header text-center fw-bold">
                Império das Sombras - Criado por Eloa
            </div>

            <!-- Body -->
            <div class="card-body"
                style="
                    background-image: url('./assets/background2.gif');
                    background-size: cover;
                    background-position: center;
                    background-repeat: no-repeat;
                    min-height: 550px;
                ">

                <div class="row">

                    <!-- HERO -->
                    <div class="col">

                        <ul class="list-group text-end">

                            <li class="list-group-item">
                                <strong id="nome-hero"></strong>
                            </li>

                            <li class="list-group-item">
                                <span id="titulo-hero"></span>
                            </li>

                            <li class="list-group-item">
                                ❤️
                                <progress
                                    id="hp-hero"
                                    value="100"
                                    max="100"
                                    style="accent-color: red;">
                                </progress>
                            </li>

                            <li class="list-group-item">
                                🧪
                                <progress
                                    id="mp-hero"
                                    value="100"
                                    max="100"
                                    style="accent-color: lightblue;">
                                </progress>
                            </li>

                            <li class="list-group-item">
                                ⚡
                                <progress
                                    id="en-hero"
                                    value="0"
                                    max="100"
                                    style="accent-color: green;">
                                </progress>
                            </li>

                        </ul>

                    </div>


                    <!-- BOSS -->
                    <div class="col">

                        <ul class="list-group">

                            <li class="list-group-item">
                                <strong id="nome-boss">
                                    Azog
                                </strong>
                            </li>

                            <li class="list-group-item">
                                O guerreiro polvo
                            </li>

                            <li class="list-group-item">
                                ❤️
                                <progress
                                    id="hp-boss"
                                    value="100"
                                    max="100"
                                    style="accent-color: red;">
                                </progress>
                            </li>

                            <li class="list-group-item">
                                🧪
                                <progress
                                    value="0"
                                    max="100"
                                    style="accent-color: lightblue;">
                                </progress>
                            </li>

                            <li class="list-group-item">
                                ⚡
                                <progress
                                    value="50"
                                    max="100"
                                    style="accent-color: green;">
                                </progress>
                            </li>

                        </ul>

                    </div>

                </div>


                <!-- Imagens -->
                <div class="row mt-4 align-items-center">

                    <!-- HERO -->
                    <div class="col text-end">

                        <img
                            src="./assets/arqueira.gif"
                            width="220"
                            height="220"
                            alt="Arqueira">

                        <!-- Botões de ataque -->
                        <div id="controles"
                            class="mt-3 d-flex gap-2 justify-content-end flex-wrap">
                        </div>

                    </div>


                    <!-- BOSS -->
                    <div class="col">

                        <img
                            src="./assets/profundo.gif"
                            width="220"
                            height="220"
                            alt="Azog">

                    </div>

                </div>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center fw-bold">
                ⚔️ Confronto Final ⚔️
            </div>

        </div>

    </div>

    <script src="./javascript.js"></script>

</body>

</html>
