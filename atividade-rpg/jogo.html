<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <div class="card">

            <!-- Header -->
            <div class="card-header text-center">
                Império das Sombras - Criado por Eloa
            </div>

            <!-- Body -->
            <div class="card-body"
                style="
                    background-image: url('./assets/background2.gif');
                    background-size: cover;
                    background-position: center;
                    background-repeat: no-repeat;
                    min-height: 500px;
                ">

                <div class="row">

                    <!-- Personagem 1 -->
                    <div class="col">
                        <ul class="list-group text-end">

                            <li class="list-group-item">
                                <strong id="Arqueira">Arqueira</strong>
                            </li>

                            <li class="list-group-item">
                                Mestre das Névoas
                            </li>

                            <li class="list-group-item">
                                ❤️
                                <progress value="90" max="100"
                                    style="accent-color: red;"></progress>
                            </li>

                            <li class="list-group-item">
                                🧪
                                <progress value="80" max="100"
                                    style="accent-color: lightblue;"></progress>
                            </li>

                            <li class="list-group-item">
                                ⚡
                                <progress value="80" max="100"
                                    style="accent-color: green;"></progress>
                            </li>

                        </ul>
                    </div>

                    <!-- Personagem 2 -->
                    <div class="col">
                        <ul class="list-group">

                            <li class="list-group-item">
                                <strong id="Profundo">Profundo</strong>
                            </li>

                            <li class="list-group-item">
                                Caçador Sombrio
                            </li>

                            <li class="list-group-item">
                                ❤️
                                <progress value="70" max="100"
                                    style="accent-color: red;"></progress>
                            </li>

                            <li class="list-group-item">
                                🧪
                                <progress value="60" max="100"
                                    style="accent-color: lightblue;"></progress>
                            </li>

                            <li class="list-group-item">
                                ⚡
                                <progress value="85" max="100"
                                    style="accent-color: green;"></progress>
                            </li>

                        </ul>
                    </div>

                </div>

                <!-- Imagens -->
                <div class="row mt-3">

                    <!-- IMG PERSONAGEM 1 -->
                    <div class="col text-end">
                        <img src="./assets/arqueira.gif"
                             width="200"
                             height="200"
                             alt="Arqueira">
                             <div id = "controles"><</div>
                    </div>

                    <!-- IMG PERSONAGEM 2 -->
                    <div class="col">
                        <img src="./assets/profundo.gif"
                             width="200"
                             height="200"
                             alt="Profundo">
                    </div>

                </div>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center">
                Confronto Final
            </div>

        </div>

    </div>

</body>

<script src="./javascript.js"></script>

</html>
